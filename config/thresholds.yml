# When is an opportunity worth writing a document for?
#
# The assignment asks me to pick a threshold and defend it. This is the defence, including
# the part where my first attempt was wrong.
#
# I first set the floor at $250/month, reasoning that it is about 45 minutes a week and
# that below that a written procedure costs more attention to maintain than it returns.
# That reasoning is fine in the abstract and it was wrong here, because it ignored a
# decision made elsewhere in this repo: `extrapolation_factor: 1.0`. Every dollar figure in
# this report is scoped to four mailboxes and deliberately not scaled to a company. A floor
# calibrated against company-sized numbers, applied to four-mailbox numbers, cleared exactly
# three items - and all three were "send this recurring report on a schedule". It excluded
# every operationally interesting finding in the archive: deal-entry correction in Sitara,
# meter-level variance clearing across Unify, unmatched meter flow written off to Logistics.
#
# So the gate is on **evidence and recurrence**, which is what I can actually defend, and
# the dollar floor is set low enough to be non-binding for well-evidenced recurring work.
# The dollar figure is still reported prominently on every artifact's opportunity; it is
# just not the thing doing the gating, because my own refusal to extrapolate put it on a
# scale that a company-sized threshold cannot read.

artifacts:
  # About 0.7 automatable hours a month. Deliberately low, and low for a stated reason: see
  # above. It exists to exclude noise, not to rank.
  min_dollars_per_month: 55

  # This is the real gate. A document is a much stronger claim than a table row: a row says
  # "we saw this pattern", a document says "here is how this work is done". So the evidence
  # bar is higher than the bar for appearing in the ranking at all, and drafting a procedure
  # off two quotes is exactly how a credible report becomes a discredited one.
  min_verified_citations: 5
  min_distinct_messages: 4

  # Recurrence, measured rather than assumed. Fewer than six instances is not a routine
  # worth a procedure, and a burst inside a single month is a project rather than a process.
  min_instances: 6
  min_months: 3

  # Six is what a team will actually adopt in a quarter. Twelve is shelfware, and shipping
  # twelve would be optimising for looking thorough rather than for being used.
  max_artifacts: 6

  # One slot for the best-evidenced opportunity that fails *only* the dollar floor, marked
  # in its front matter as a judgment call. A purely numeric cutoff is not a strategy: the
  # cheapest process to fix is sometimes the one worth fixing first, because it is the one
  # people will accept a change to.
  allow_one_judgment_exception: true

  rationale: >
    The gate is evidence and recurrence, not money. A dollar floor calibrated for a whole
    company cannot be applied to figures deliberately scoped to four mailboxes: at $250 a
    month it cleared only three items, all recurring-report sends, and excluded every
    operational finding in the archive. The evidence bar is higher than the bar for the
    ranking because a procedure someone acts on is a stronger claim than a row in a table.
    The cap of six reflects what a team adopts in a quarter rather than what looks thorough.