[project]
name = "observation-agent"
version = "1.0.0"
description = "Observation agent over a raw email archive: deterministic evidence, Claude Code judgment"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "scipy>=1.14",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100"]

[project.scripts]
observe = "observe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["observe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: slower tests (the 350KB message)"]
